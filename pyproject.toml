[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fulfillment-copilot"
version = "0.1.0"
description = "服务履约质量智能运营助手：一站式到家服务的全链路履约监控、异常归因与 AI 报告生成"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "fulfillment-copilot contributors" }]
keywords = ["service-operations", "fulfillment", "quality-monitoring", "anomaly-detection", "ai-reports"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Other Audience",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business",
]
# 核心零第三方依赖：数据分析、异常检测、报告与看板全部用标准库实现
dependencies = []

[project.optional-dependencies]
# Excel 导出（可选）：不安装也能跑通全流程，只是跳过 .xlsx
excel = ["openpyxl>=3.1"]
dev = ["pytest>=8.0"]

[project.scripts]
fulfillment-copilot = "fulfillment_copilot.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
